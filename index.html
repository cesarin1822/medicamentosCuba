<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicamentos Guantánamo</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #eef1f5;
  --surface:      #ffffff;
  --ink:          #0d1b2a;
  --ink-muted:    #4a5568;
  --ink-faint:    #9aa5b4;
  --navy:         #0d2b55;
  --navy-dark:    #071a38;
  --navy-mid:     #1a3f6f;
  --blue-light:   #e8f0fa;
  --accent:       #1565c0;
  --accent-light: #e3edf9;
  --border:       #d0d9e4;
  --border-strong:#b0bccf;
  --row-alt:      #f4f7fb;
  --radius:       4px;
  --shadow:       0 1px 8px rgba(13,27,42,0.10), 0 0 0 1px rgba(13,27,42,0.06);
}

body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding: 2rem 1.25rem 4rem;
}

.page { max-width: 1040px; margin: 0 auto; }

header {
  background: var(--navy-dark);
  border-radius: var(--radius);
  padding: 1.5rem 2rem;
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.header-brand { display: flex; align-items: center; gap: 1rem; }

.brand-icon {
  width: 46px; height: 46px;
  background: var(--navy-mid);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}

.brand-sup {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #7fa8d8;
  font-weight: 500;
  margin-bottom: 3px;
}

h1 {
  font-size: clamp(17px, 3vw, 23px);
  font-weight: 600;
  color: #ffffff;
  letter-spacing: -0.01em;
  line-height: 1.2;
}

.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.pct-box {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: var(--radius);
  padding: 7px 12px;
}

.pct-label {
  font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: #9ab8d8; white-space: nowrap;
}

.pct-box input[type=number] {
  width: 46px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 16px; font-weight: 500; color: #ffffff;
  border: none; background: transparent; outline: none;
  text-align: right; -moz-appearance: textfield;
}
.pct-box input[type=number]::-webkit-outer-spin-button,
.pct-box input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
.pct-sym { font-size: 16px; font-weight: 500; color: #7fa8d8; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.05em; text-transform: uppercase;
  border: none; border-radius: var(--radius);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #0d47a1; }
.btn-primary:active { transform: scale(0.97); }
.btn-ghost { background: rgba(255,255,255,0.08); color: #c8d8ea; border: 1px solid rgba(255,255,255,0.18); }
.btn-ghost:hover { background: rgba(255,255,255,0.14); }

/* summary cards mobile */
.summary-cards { display: none; gap: 10px; margin-bottom: 1.25rem; }
.sum-card {
  flex: 1; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px; min-width: 0; box-shadow: var(--shadow);
}
.sum-card.green { border-top: 3px solid #2e7d32; }
.sum-card.blue  { border-top: 3px solid var(--accent); }
.sum-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 5px; font-weight: 500; }
.sum-value { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum-card.blue .sum-value { color: var(--accent); }

/* table */
.table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.col-label-strip {
  display: grid;
  grid-template-columns: 22% 34% 8% 13% 11% 12%;
  background: var(--navy-dark);
  border-bottom: 2px solid var(--navy-mid);
}
.col-label-strip span {
  padding: 11px 14px;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.10em; text-transform: uppercase;
  color: #7fa8d8;
  border-right: 1px solid rgba(255,255,255,0.07);
}
.col-label-strip span:last-child { border-right: none; }
.col-label-strip span.num { text-align: right; }
.col-label-strip span.accent-col { color: #64b5f6; }

.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

table {
  width: 100%; border-collapse: collapse;
  font-size: 16px; table-layout: fixed;
}
col.c-prod { width: 22%; }
col.c-pres { width: 34%; }
col.c-cant { width: 8%; }
col.c-prec { width: 13%; }
col.c-tot  { width: 11%; }
col.c-plus { width: 12%; }

thead th { display: none; }

tbody tr { border-bottom: 1px solid var(--border); }
tbody tr:nth-child(even) { background: var(--row-alt); }
tbody tr:hover { background: var(--accent-light); }
tr.prednisona { background: #fffbea; }



td {
  padding: 10px 14px;
  vertical-align: middle;
  border-right: 1px solid var(--border);
  overflow: hidden;
}
td:last-child { border-right: none; }
td.num { text-align: right; }

.prod-name {
  font-weight: 600; font-size: 16px; color: var(--navy-dark);
  display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nota-badge {
  display: inline-block; font-size: 10px; padding: 1px 7px;
  background: var(--blue-light); border: 1px solid #b0c8e8;
  border-radius: 3px; color: var(--accent); font-weight: 500;
  white-space: nowrap; margin-top: 2px;
}
.pres-text { font-size: 14px; color: var(--ink-muted); line-height: 1.4; }

input.cell-input {
  width: 100%;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 15px; color: var(--ink);
  background: transparent;
  border: 1px solid transparent; border-radius: 3px;
  padding: 3px 4px; text-align: right;
  outline: none; transition: all 0.12s; -moz-appearance: textfield;
}
input.cell-input::-webkit-outer-spin-button,
input.cell-input::-webkit-inner-spin-button { -webkit-appearance: none; }
input.cell-input:hover { border-color: var(--border-strong); background: var(--bg); }
input.cell-input:focus { border-color: var(--accent); background: var(--accent-light); box-shadow: 0 0 0 2px rgba(21,101,192,0.10); }

.val-total { font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: var(--ink); }
.val-plus  { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; color: var(--accent); }

.total-row td {
  background: var(--navy-dark); color: #fff;
  font-weight: 600; font-size: 16px;
  border-color: var(--navy-dark); padding: 13px 14px;
}
.total-row .val-total { color: #cfe2ff; font-size: 16px; }
.total-row .val-plus  { color: #64b5f6; font-size: 16px; }

/* mobile cards */
.mobile-list { display: none; flex-direction: column; gap: 10px; }
.mob-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
}
.mob-card.prednisona-card { background: #fffbea; }
.mob-card-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  padding: 10px 14px; background: var(--navy-dark); border-bottom: 2px solid var(--navy-mid);
}
.mob-prod { font-size: 15px; font-weight: 600; color: #fff; }
.mob-pres { font-size: 12px; color: #8aadd4; margin-top: 2px; }
.mob-badge {
  font-size: 10px; padding: 2px 8px;
  background: rgba(100,181,246,0.15); border: 1px solid rgba(100,181,246,0.3);
  border-radius: 3px; color: #64b5f6; white-space: nowrap; flex-shrink: 0; margin-top: 2px;
}
.mob-card-body { display: grid; grid-template-columns: 1fr 1fr; }
.mob-field {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
}
.mob-field:nth-child(2n) { border-right: none; }
.mob-field:nth-last-child(-n+2) { border-bottom: none; }
.mob-field-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); font-weight: 600; margin-bottom: 5px; }
.mob-field-val { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500; color: var(--ink); text-align: right; }
.mob-field-val.accent { color: var(--accent); font-weight: 600; }
input.mob-input {
  width: 100%; font-family: 'IBM Plex Mono', monospace;
  font-size: 17px; font-weight: 500; color: var(--ink);
  background: transparent; border: none;
  border-bottom: 2px solid var(--border-strong);
  padding: 2px 0; text-align: right; outline: none; -moz-appearance: textfield;
}
input.mob-input::-webkit-outer-spin-button,
input.mob-input::-webkit-inner-spin-button { -webkit-appearance: none; }
input.mob-input:focus { border-bottom-color: var(--accent); color: var(--accent); }

footer {
  margin-top: 1.5rem; display: flex;
  justify-content: space-between; align-items: center;
  font-size: 11px; color: var(--ink-faint);
  letter-spacing: 0.04em; flex-wrap: wrap; gap: 6px;
}
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 3px; padding: 3px 10px; font-size: 11px;
  color: var(--ink-muted); font-weight: 500;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: #43a047; }

@media (max-width: 660px) {
  body { padding: 1rem 0.75rem 3rem; }
  header { padding: 1rem 1.25rem; }
  .col-label-strip { display: none; }
  .table-card { display: none; }
  .mobile-list { display: flex; }
  .summary-cards { display: flex; }
  .btn { padding: 8px 12px; font-size: 11px; }
}
@media (min-width: 661px) {
  .summary-cards { display: none !important; }
  .mobile-list { display: none !important; }
  .table-card { display: block; }
}
@media print {
  body { background: white; padding: 0; }
  header { border-radius: 0; }
  .btn, footer { display: none !important; }
  .table-card { box-shadow: none; }
}
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="header-brand">
      <div class="brand-icon">💊</div>
      <div class="brand-text">
        <div class="brand-sup">Inventario Médico · Pesos Cubanos</div>
        <h1>Medicamentos Guantánamo</h1>
      </div>
    </div>
    <div class="controls">
      <div class="pct-box">
        <span class="pct-label">Recargo</span>
        <input type="number" id="pct" value="10" min="0" max="999" step="1">
        <span class="pct-sym">%</span>
      </div>
      <button class="btn btn-ghost" onclick="resetTable()">↺ Resetear</button>
      <button class="btn btn-primary" onclick="exportPDF()">⬇ Exportar PDF</button>
    </div>
  </header>

  <div class="summary-cards">
    <div class="sum-card green">
      <div class="sum-label">Total CUP</div>
      <div class="sum-value" id="mob-grand-total">—</div>
    </div>
    <div class="sum-card blue">
      <div class="sum-label" id="mob-pct-label">Total +10%</div>
      <div class="sum-value" id="mob-grand-plus">—</div>
    </div>
  </div>

  <div class="table-card">
    <div class="col-label-strip">
      <span>Producto</span>
      <span>Presentación</span>
      <span class="num">Cant.</span>
      <span class="num">Precio unit.</span>
      <span class="num">Total</span>
      <span class="num accent-col" id="pct-header">Total +10%</span>
    </div>
    <div class="tbl-wrap">
      <table id="medtable">
        <colgroup>
          <col class="c-prod"><col class="c-pres"><col class="c-cant">
          <col class="c-prec"><col class="c-tot"><col class="c-plus">
        </colgroup>
        <thead><tr>
          <th>Producto</th><th>Presentación</th><th>Cant.</th>
          <th>Precio</th><th>Total</th><th>+%</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
        <tfoot>
          <tr class="total-row">
            <td colspan="4" style="letter-spacing:0.06em">TOTAL GENERAL</td>
            <td class="num"><span class="val-total" id="grand-total">—</span></td>
            <td class="num"><span class="val-plus"  id="grand-plus">—</span></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <div class="mobile-list" id="mobile-list"></div>

  <footer>
    <span>Precios en Pesos Cubanos (CUP) · Cálculos en tiempo real</span>
    <span class="pill"><span class="dot"></span> Campos editables</span>
  </footer>

</div>
<script>
const ORIGINAL = [
  {prod:"Alprazolam",    pres:"0.05 mg x 200 Tab",  cant:261, precio:320,  nota:"261 blister"},
  {prod:"Amoxicilina",   pres:"250mg x 60ml JBE",    cant:10,  precio:600,  nota:""},
  {prod:"Aciclovir",     pres:"5% x 5gr Crema",      cant:10,  precio:600,  nota:""},
  {prod:"Ketoconazol",   pres:"2% x 20gr Crema",     cant:5,   precio:500,  nota:""},
  {prod:"Hidrosona",     pres:"1% x 20gr Crema",     cant:5,   precio:600,  nota:""},
  {prod:"Prednisona",    pres:"20mg x 100 Tab",      cant:0,   precio:0,    nota:""},
  {prod:"Cefalexina",    pres:"500mg x 100 Tab",     cant:50,  precio:450,  nota:"50 blister"},
  {prod:"Azitromicina",  pres:"200mg x 15ml JBE",    cant:10,  precio:500,  nota:""},
  {prod:"Azitromicina",  pres:"500mg x 30 Tab",      cant:30,  precio:500,  nota:"30 blister"},
  {prod:"Clobetasol",    pres:"Crema 0.05% x 25gr",  cant:5,   precio:650,  nota:""},
  {prod:"Dipha-Scbix",   pres:"x 30gr Crema",        cant:1,   precio:700,  nota:""},
  {prod:"Portil NF",     pres:"x 20gr Crema",        cant:3,   precio:600,  nota:""},
  {prod:"Amitriptilina", pres:"Caja 100 Tab",        cant:100, precio:350,  nota:"100 blister"},
  {prod:"Paracetamol",   pres:"—",                   cant:5,   precio:500,  nota:""},
];

let state = ORIGINAL.map(r => ({...r}));
const fmt    = n => n == null ? "—" : Math.round(n).toLocaleString('es-ES');
const getPct = () => parseFloat(document.getElementById('pct').value) || 0;

function calcRow(r) {
  if (r.cant == null || r.precio == null) return {total:null, plus:null};
  const total = r.cant * r.precio;
  const plus  = Math.round(total * (1 + getPct()/100));
  return {total, plus};
}

function getGrandTotals() {
  let gT=0, gP=0;
  state.forEach(r => { const c=calcRow(r); if(c.total) gT+=c.total; if(c.plus) gP+=c.plus; });
  return {gT, gP};
}

function updateFooters() {
  const pct=getPct(), {gT,gP}=getGrandTotals();
  ['grand-total','mob-grand-total'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=fmt(gT);});
  ['grand-plus','mob-grand-plus'].forEach(id  =>{const e=document.getElementById(id);if(e)e.textContent=fmt(gP);});
  ['pct-header','mob-pct-label'].forEach(id   =>{const e=document.getElementById(id);if(e)e.textContent=`Total +${pct}%`;});
}

function renderDesktop() {
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  document.getElementById('pct-header').textContent=`Total +${getPct()}%`;
  state.forEach((r,i)=>{
    const {total,plus}=calcRow(r), isPred=r.prod==='Prednisona';
    const tr=document.createElement('tr');
    if(isPred) tr.className='prednisona';
    if(isPred) tr.className='prednisona';
    tr.innerHTML=`
      <td>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="prod-name">${r.prod}</span>
        </div>
        ${r.nota?`<span class="nota-badge">${r.nota}</span>`:''}
      </td>
      <td><span class="pres-text">${r.pres}</span></td>
      <td class="num"><input class="cell-input" type="number" data-i="${i}" data-f="cant" value="${r.cant??''}" placeholder="—"  min="0"></td>
      <td class="num"><input class="cell-input" type="number" data-i="${i}" data-f="precio" value="${r.precio??''}" placeholder="—"  min="0"></td>
      <td class="num"><span class="val-total" id="tot-${i}">${fmt(total)}</span></td>
      <td class="num"><span class="val-plus"  id="plus-${i}">${fmt(plus)}</span></td>
    `;
    tbody.appendChild(tr);
  });
  updateFooters();
}

document.getElementById('tbody').addEventListener('input',e=>{
  const inp=e.target;
  if(!inp.classList.contains('cell-input')) return;
  const i=parseInt(inp.dataset.i),f=inp.dataset.f;
  state[i][f]=inp.value===''?null:parseFloat(inp.value);
  const {total,plus}=calcRow(state[i]);
  document.getElementById(`tot-${i}`).textContent=fmt(total);
  document.getElementById(`plus-${i}`).textContent=fmt(plus);
  syncMobCard(i); updateFooters();
});

function renderMobile() {
  const list=document.getElementById('mobile-list');
  list.innerHTML='';
  state.forEach((r,i)=>{
    const {total,plus}=calcRow(r),isPred=r.prod==='Prednisona';
    const div=document.createElement('div');
    div.className='mob-card'+(isPred?' prednisona-card':'');
    div.id=`mob-card-${i}`;
    div.innerHTML=`
      <div class="mob-card-header">
        <div><div class="mob-prod">${r.prod}</div><div class="mob-pres">${r.pres}</div></div>
        <div style="display:flex;align-items:center;gap:6px">
          ${r.nota?`<span class="mob-badge">${r.nota}</span>`:''}
        </div>
      </div>
      <div class="mob-card-body">
        <div class="mob-field"><div class="mob-field-label">Cantidad</div>
          ${false?`<div class="mob-field-val">—</div>`:`<input class="mob-input" type="number" inputmode="decimal" data-i="${i}" data-f="cant" value="${r.cant??''}" placeholder="—" min="0">`}
        </div>
        <div class="mob-field"><div class="mob-field-label">Precio unit.</div>
          ${false?`<div class="mob-field-val">—</div>`:`<input class="mob-input" type="number" inputmode="decimal" data-i="${i}" data-f="precio" value="${r.precio??''}" placeholder="—" min="0">`}
        </div>
        <div class="mob-field"><div class="mob-field-label">Total CUP</div>
          <div class="mob-field-val" id="mob-tot-${i}">${fmt(total)}</div>
        </div>
        <div class="mob-field"><div class="mob-field-label" id="mob-pct-lbl-${i}">Total +${getPct()}%</div>
          <div class="mob-field-val accent" id="mob-plus-${i}">${fmt(plus)}</div>
        </div>
      </div>`;
    list.appendChild(div);
  });
}

document.getElementById('mobile-list').addEventListener('input',e=>{
  const inp=e.target;
  if(!inp.classList.contains('mob-input')) return;
  const i=parseInt(inp.dataset.i),f=inp.dataset.f;
  state[i][f]=inp.value===''?null:parseFloat(inp.value);
  const {total,plus}=calcRow(state[i]);
  document.getElementById(`mob-tot-${i}`).textContent=fmt(total);
  document.getElementById(`mob-plus-${i}`).textContent=fmt(plus);
  syncDesktopRow(i); updateFooters();
});

function syncMobCard(i) {
  const {total,plus}=calcRow(state[i]);
  const te=document.getElementById(`mob-tot-${i}`),pe=document.getElementById(`mob-plus-${i}`);
  const ci=document.querySelector(`#mobile-list .mob-input[data-i="${i}"][data-f="cant"]`);
  const pi=document.querySelector(`#mobile-list .mob-input[data-i="${i}"][data-f="precio"]`);
  if(te)te.textContent=fmt(total); if(pe)pe.textContent=fmt(plus);
  if(ci)ci.value=state[i].cant??''; if(pi)pi.value=state[i].precio??'';
}
function syncDesktopRow(i) {
  const {total,plus}=calcRow(state[i]);
  const te=document.getElementById(`tot-${i}`),pe=document.getElementById(`plus-${i}`);
  const ci=document.querySelector(`#tbody input[data-i="${i}"][data-f="cant"]`);
  const pi=document.querySelector(`#tbody input[data-i="${i}"][data-f="precio"]`);
  if(te)te.textContent=fmt(total); if(pe)pe.textContent=fmt(plus);
  if(ci)ci.value=state[i].cant??''; if(pi)pi.value=state[i].precio??'';
}

document.getElementById('pct').addEventListener('input',()=>{
  const pct=getPct();
  document.getElementById('pct-header').textContent=`Total +${pct}%`;
  state.forEach((r,i)=>{
    const {plus}=calcRow(r);
    const de=document.getElementById(`plus-${i}`),me=document.getElementById(`mob-plus-${i}`),le=document.getElementById(`mob-pct-lbl-${i}`);
    if(de)de.textContent=fmt(plus); if(me)me.textContent=fmt(plus); if(le)le.textContent=`Total +${pct}%`;
  });
  updateFooters();
});

function resetTable() {
  if(!confirm('¿Restaurar todos los valores originales?')) return;
  state=ORIGINAL.map(r=>({...r}));
  document.getElementById('pct').value='10';
  renderDesktop(); renderMobile(); updateFooters();
}

function exportPDF() {
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const pct=getPct(), ML=14, MR=14;

  doc.setFillColor(7,26,56);
  doc.rect(0,0,210,38,'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(16); doc.setTextColor(255,255,255);
  doc.text('Medicamentos Guantanamo',ML,15);
  doc.setFont('helvetica','normal');
  doc.setFontSize(9); doc.setTextColor(138,173,212);
  doc.text('Inventario Medico · Precios en Pesos Cubanos (CUP)',ML,23);
  doc.text(`Recargo: ${pct}%   ·   Fecha: ${new Date().toLocaleDateString('es-ES')}`,ML,30);

  const head=[['Producto','Presentacion','Cant.','Precio Unit.','Total',`+${pct}%`]];
  let gT=0,gP=0;
  const body=state.map(r=>{
    const {total,plus}=calcRow(r);
    if(total)gT+=total; if(plus)gP+=plus;
    return [r.prod,r.pres,
      r.cant!=null?r.cant.toLocaleString('es-ES'):'',
      r.precio!=null?r.precio.toLocaleString('es-ES'):'',
      total!=null?Math.round(total).toLocaleString('es-ES'):'',
      plus!=null?Math.round(plus).toLocaleString('es-ES'):''];
  });
  body.push(['TOTAL GENERAL','','','',
    Math.round(gT).toLocaleString('es-ES'),
    Math.round(gP).toLocaleString('es-ES')]);

  doc.autoTable({
    head,body,startY:44,
    styles:{font:'helvetica',fontSize:9,cellPadding:{top:3,bottom:3,left:4,right:4},textColor:[13,27,42],lineColor:[208,217,228],lineWidth:0.3},
    headStyles:{fillColor:[7,26,56],textColor:[127,168,216],fontStyle:'bold',fontSize:9,cellPadding:{top:5,bottom:5,left:4,right:4}},
    alternateRowStyles:{fillColor:[244,247,251]},
    tableLineColor:[208,217,228],tableLineWidth:0.3,
    columnStyles:{
      0:{fontStyle:'bold',cellWidth:36,fontSize:9,textColor:[7,26,56]},
      1:{cellWidth:70,fontSize:9,textColor:[74,85,104]},
      2:{halign:'right',cellWidth:12,fontSize:9},
      3:{halign:'right',cellWidth:20,fontSize:9},
      4:{halign:'right',cellWidth:22,fontSize:9},
      5:{halign:'right',cellWidth:22,fontSize:9,textColor:[21,101,192],fontStyle:'bold'},
    },
    didParseCell(data){
      if(data.row.raw[0]==='Prednisona'&&data.section==='body'){data.cell.styles.textColor=[154,165,180];}
      if(data.row.raw[0]==='TOTAL GENERAL'&&data.section==='body'){
        data.cell.styles.fillColor=[7,26,56];data.cell.styles.textColor=[255,255,255];
        data.cell.styles.fontStyle='bold';data.cell.styles.fontSize=10;
        if(data.column.index===5)data.cell.styles.textColor=[100,181,246];
      }
    },
    margin:{left:ML,right:MR},
  });

  const fy=doc.lastAutoTable.finalY+7;
  doc.setDrawColor(208,217,228); doc.setLineWidth(0.4); doc.line(ML,fy,210-MR,fy);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(154,165,180);
  doc.text('Documento generado electronicamente · Solo para uso interno',ML,fy+5);

  doc.save(`Medicamentos_Guantanamo_${new Date().toISOString().slice(0,10)}.pdf`);
}

renderDesktop(); renderMobile(); updateFooters();
</script>
</body>
</html>
