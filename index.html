<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicamentos Guantánamo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f2eb;
  --surface: #ffffff;
  --ink: #1a1612;
  --ink-muted: #6b6257;
  --ink-faint: #b0a89e;
  --accent: #c4440a;
  --accent-light: #fdf2ed;
  --border: #ddd8d0;
  --border-strong: #c4bdb4;
  --row-alt: #faf8f5;
  --header-bg: #1a1612;
  --header-fg: #f5f2eb;
  --total-bg: #2e2820;
  --total-fg: #f5f2eb;
  --radius: 6px;
  --shadow: 0 2px 16px rgba(26,22,18,0.09);
}

body {
  font-family: 'DM Mono', monospace;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  padding: 1.25rem 0.75rem 4rem;
}

.page { max-width: 980px; margin: 0 auto; }

/* ── HEADER ── */
header {
  margin-bottom: 1.25rem;
  padding-bottom: 1.25rem;
  border-bottom: 2px solid var(--ink);
}

.eyebrow {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 500;
  margin-bottom: 4px;
}

h1 {
  font-family: 'Fraunces', serif;
  font-size: clamp(22px, 5vw, 36px);
  font-weight: 300;
  line-height: 1.1;
  letter-spacing: -0.02em;
}

h1 em { font-style: italic; color: var(--accent); }

/* ── CONTROLS BAR ── */
.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 1rem;
  flex-wrap: wrap;
}

.pct-box {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 8px 12px;
  flex-shrink: 0;
}

.pct-label {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
  white-space: nowrap;
}

.pct-box input[type=number] {
  width: 48px;
  font-family: 'DM Mono', monospace;
  font-size: 15px;
  font-weight: 500;
  color: var(--accent);
  border: none;
  background: transparent;
  outline: none;
  text-align: right;
  -moz-appearance: textfield;
}
.pct-box input[type=number]::-webkit-outer-spin-button,
.pct-box input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

.pct-sym { font-size: 15px; font-weight: 500; color: var(--accent); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 14px;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #a33808; }
.btn-primary:active { transform: scale(0.97); }

.btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--border-strong); }
.btn-ghost:hover { background: var(--row-alt); }

/* ── SUMMARY CARDS (mobile) ── */
.summary-cards {
  display: none;
  gap: 10px;
  margin-bottom: 1rem;
}

.sum-card {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  min-width: 0;
}

.sum-label {
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 4px;
}

.sum-value {
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sum-card.accent .sum-value { color: var(--accent); }

/* ── DESKTOP TABLE ── */
.table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 640px;
}

thead th {
  background: var(--header-bg);
  color: var(--header-fg);
  padding: 12px 13px;
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 500;
  white-space: nowrap;
  border-right: 1px solid #2e2820;
}
thead th:last-child { border-right: none; }
thead th.num { text-align: right; }

tbody tr:nth-child(even) { background: var(--row-alt); }
tbody tr:hover { background: var(--accent-light); }
tr.prednisona { opacity: 0.38; pointer-events: none; }

td {
  padding: 9px 13px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
td:last-child { border-right: none; }
td.num { text-align: right; }

.prod-name { font-weight: 500; }
.pres-text { font-size: 11px; color: var(--ink-muted); font-style: italic; }

input.cell-input {
  width: 100%;
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: var(--ink);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 3px;
  padding: 4px 5px;
  text-align: right;
  outline: none;
  transition: all 0.12s;
  -moz-appearance: textfield;
  min-width: 60px;
}
input.cell-input::-webkit-outer-spin-button,
input.cell-input::-webkit-inner-spin-button { -webkit-appearance: none; }
input.cell-input:hover { border-color: var(--border-strong); background: var(--bg); }
input.cell-input:focus { border-color: var(--accent); background: var(--accent-light); }

.col-pct { color: var(--accent) !important; font-weight: 500; }

.total-row td {
  background: var(--total-bg);
  color: var(--total-fg);
  font-weight: 500;
  font-size: 13px;
  border-color: var(--total-bg);
  padding: 13px 13px;
}
.total-row .col-pct { color: #ffb899 !important; }

.nota-tag {
  display: inline-block;
  font-size: 9px;
  padding: 2px 7px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--ink-muted);
  white-space: nowrap;
}

/* ── MOBILE CARDS VIEW ── */
.mobile-list { display: none; flex-direction: column; gap: 8px; }

.mob-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.mob-card.prednisona-card { opacity: 0.38; pointer-events: none; }

.mob-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px 8px;
  background: var(--header-bg);
}

.mob-prod { font-size: 13px; font-weight: 500; color: var(--header-fg); }
.mob-pres { font-size: 10px; color: #9e9590; margin-top: 2px; font-style: italic; }

.mob-nota-tag {
  font-size: 9px;
  padding: 2px 8px;
  background: rgba(255,255,255,0.12);
  border-radius: 20px;
  color: #c8c0b8;
  white-space: nowrap;
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 2px;
}

.mob-card-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}

.mob-field {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
}

.mob-field:nth-child(2n) { border-right: none; }
.mob-field:nth-last-child(-n+2) { border-bottom: none; }

.mob-field-label {
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 5px;
}

.mob-field-val {
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  text-align: right;
}

.mob-field-val.accent { color: var(--accent); }

input.mob-input {
  width: 100%;
  font-family: 'DM Mono', monospace;
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  background: transparent;
  border: none;
  border-bottom: 1.5px solid var(--border-strong);
  padding: 2px 0;
  text-align: right;
  outline: none;
  -moz-appearance: textfield;
}
input.mob-input::-webkit-outer-spin-button,
input.mob-input::-webkit-inner-spin-button { -webkit-appearance: none; }
input.mob-input:focus { border-bottom-color: var(--accent); color: var(--accent); }

/* ── FOOTER ── */
footer {
  margin-top: 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: 0.05em;
  flex-wrap: wrap;
  gap: 6px;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 10px;
  color: var(--ink-muted);
}

.dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  body { padding: 1rem 0.625rem 3rem; }
  .table-card { display: none; }
  .mobile-list { display: flex; }
  .summary-cards { display: flex; }
  .controls { gap: 6px; }
  .btn { padding: 8px 11px; font-size: 10px; }
  .pct-box { padding: 7px 10px; }
}

@media (min-width: 641px) {
  body { padding: 1.5rem 1rem 4rem; }
  .summary-cards { display: none !important; }
  .mobile-list { display: none !important; }
  .table-card { display: block; }
}

@media print {
  body { background: white; padding: 0; }
  .btn, .btn-ghost, footer { display: none; }
  .table-card { box-shadow: none; }
}
</style>
</head>
<body>
<div class="page">

  <header>
    <p class="eyebrow">Inventario · Pesos Cubanos</p>
    <h1>Medicamentos <em>Guantánamo</em></h1>
    <div class="controls">
      <div class="pct-box">
        <span class="pct-label">%</span>
        <input type="number" id="pct" value="10" min="0" max="999" step="1">
        <span class="pct-sym">%</span>
      </div>
      <button class="btn btn-ghost" onclick="resetTable()">↺ Resetear</button>
      <button class="btn btn-primary" onclick="exportPDF()">⬇ PDF</button>
    </div>
  </header>

  <!-- Summary cards (mobile only) -->
  <div class="summary-cards">
    <div class="sum-card">
      <div class="sum-label">Total</div>
      <div class="sum-value" id="mob-grand-total">—</div>
    </div>
    <div class="sum-card accent">
      <div class="sum-label" id="mob-pct-label">Total +10%</div>
      <div class="sum-value" id="mob-grand-plus">—</div>
    </div>
  </div>

  <!-- Desktop table -->
  <div class="table-card">
    <div class="tbl-wrap">
      <table id="medtable">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Presentación</th>
            <th class="num">Cantidad</th>
            <th class="num">Precio unit.</th>
            <th class="num">Total</th>
            <th class="num col-pct" id="pct-header">Total +10%</th>
            <th>Nota</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot>
          <tr class="total-row">
            <td colspan="4">TOTAL GENERAL</td>
            <td class="num" id="grand-total">—</td>
            <td class="num col-pct" id="grand-plus">—</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <!-- Mobile cards -->
  <div class="mobile-list" id="mobile-list"></div>

  <footer>
    <span>Precios en CUP · Cálculos en tiempo real</span>
    <span class="pill"><span class="dot"></span> Editable</span>
  </footer>

</div>

<script>
const ORIGINAL = [
  {prod:"Alprazolam",    pres:"0.05 mg x 200 Tab",  cant:261, precio:320,  nota:"261 blister"},
  {prod:"Amoxicilina",   pres:"250mg x 60ml JBE",    cant:15,  precio:600,  nota:""},
  {prod:"Aciclovir",     pres:"5% x 5gr Crema",      cant:10,  precio:600,  nota:""},
  {prod:"Ketoconazol",   pres:"2% x 20gr Crema",     cant:5,   precio:500,  nota:""},
  {prod:"Hidrosona",     pres:"1% x 20gr Crema",     cant:5,   precio:600,  nota:""},
  {prod:"Prednisona",    pres:"20mg x 100 Tab",      cant:null,precio:null, nota:""},
  {prod:"Cefalexina",    pres:"500mg x 100 Tab",     cant:50,  precio:450,  nota:"50 blister"},
  {prod:"Azitromicina",  pres:"200mg x 15ml JBE",    cant:10,  precio:500,  nota:""},
  {prod:"Azitromicina",  pres:"500mg x 30 Tab",      cant:30,  precio:500,  nota:"30 blister"},
  {prod:"Clobetasol",    pres:"Crema 0.05% x 25gr",  cant:5,   precio:650,  nota:""},
  {prod:"Dipha-Scbix",   pres:"x 30gr Crema",        cant:1,   precio:700,  nota:""},
  {prod:"Portil NF",     pres:"x 20gr Crema",        cant:3,   precio:600,  nota:""},
  {prod:"Amitriptilina", pres:"Caja 100 Tab",        cant:100, precio:350,  nota:"100 blister"},
  {prod:"Paracetamol",   pres:"—",                   cant:5,   precio:500,  nota:""},
];

let state = ORIGINAL.map(r => ({...r}));

const fmt    = n  => n == null ? "—" : Math.round(n).toLocaleString('es-ES');
const getPct = () => parseFloat(document.getElementById('pct').value) || 0;

function calcRow(r) {
  if (r.cant == null || r.precio == null) return {total:null, plus:null};
  const total = r.cant * r.precio;
  const plus  = Math.round(total * (1 + getPct()/100));
  return {total, plus};
}

function getGrandTotals() {
  let gT=0, gP=0;
  state.forEach(r => {
    const {total,plus} = calcRow(r);
    if (total) gT += total;
    if (plus)  gP += plus;
  });
  return {gT, gP};
}

function updateFooters() {
  const pct = getPct();
  const {gT, gP} = getGrandTotals();
  ['grand-total','mob-grand-total'].forEach(id => {
    const el = document.getElementById(id); if (el) el.textContent = fmt(gT);
  });
  ['grand-plus','mob-grand-plus'].forEach(id => {
    const el = document.getElementById(id); if (el) el.textContent = fmt(gP);
  });
  ['pct-header','mob-pct-label'].forEach(id => {
    const el = document.getElementById(id); if (el) el.textContent = `Total +${pct}%`;
  });
}

/* ── DESKTOP TABLE ── */
function renderDesktop() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const pct = getPct();
  document.getElementById('pct-header').textContent = `Total +${pct}%`;

  state.forEach((r, i) => {
    const {total, plus} = calcRow(r);
    const isPred = r.prod === 'Prednisona';
    const tr = document.createElement('tr');
    if (isPred) tr.className = 'prednisona';
    tr.innerHTML = `
      <td><span class="prod-name">${r.prod}</span></td>
      <td><span class="pres-text">${r.pres}</span></td>
      <td class="num">
        <input class="cell-input" type="number" data-i="${i}" data-f="cant"
          value="${r.cant??''}" placeholder="—" ${isPred?'disabled':''} min="0">
      </td>
      <td class="num">
        <input class="cell-input" type="number" data-i="${i}" data-f="precio"
          value="${r.precio??''}" placeholder="—" ${isPred?'disabled':''} min="0">
      </td>
      <td class="num" id="tot-${i}">${fmt(total)}</td>
      <td class="num col-pct" id="plus-${i}">${fmt(plus)}</td>
      <td>${r.nota ? `<span class="nota-tag">${r.nota}</span>` : ''}</td>
    `;
    tbody.appendChild(tr);
  });
  updateFooters();
}

document.getElementById('tbody').addEventListener('input', e => {
  const inp = e.target;
  if (!inp.classList.contains('cell-input')) return;
  const i   = parseInt(inp.dataset.i);
  const f   = inp.dataset.f;
  state[i][f] = inp.value === '' ? null : parseFloat(inp.value);
  const {total, plus} = calcRow(state[i]);
  document.getElementById(`tot-${i}`).textContent  = fmt(total);
  document.getElementById(`plus-${i}`).textContent = fmt(plus);
  syncMobCard(i);
  updateFooters();
});

/* ── MOBILE CARDS ── */
function renderMobile() {
  const list = document.getElementById('mobile-list');
  list.innerHTML = '';

  state.forEach((r, i) => {
    const {total, plus} = calcRow(r);
    const isPred = r.prod === 'Prednisona';
    const div = document.createElement('div');
    div.className = 'mob-card' + (isPred ? ' prednisona-card' : '');
    div.id = `mob-card-${i}`;
    div.innerHTML = `
      <div class="mob-card-header">
        <div>
          <div class="mob-prod">${r.prod}</div>
          <div class="mob-pres">${r.pres}</div>
        </div>
        ${r.nota ? `<span class="mob-nota-tag">${r.nota}</span>` : ''}
      </div>
      <div class="mob-card-body">
        <div class="mob-field">
          <div class="mob-field-label">Cantidad</div>
          ${isPred
            ? `<div class="mob-field-val">—</div>`
            : `<input class="mob-input" type="number" inputmode="decimal" data-i="${i}" data-f="cant"
                value="${r.cant??''}" placeholder="—" min="0">`
          }
        </div>
        <div class="mob-field">
          <div class="mob-field-label">Precio unit.</div>
          ${isPred
            ? `<div class="mob-field-val">—</div>`
            : `<input class="mob-input" type="number" inputmode="decimal" data-i="${i}" data-f="precio"
                value="${r.precio??''}" placeholder="—" min="0">`
          }
        </div>
        <div class="mob-field">
          <div class="mob-field-label">Total</div>
          <div class="mob-field-val" id="mob-tot-${i}">${fmt(total)}</div>
        </div>
        <div class="mob-field">
          <div class="mob-field-label" id="mob-pct-lbl-${i}">Total +${getPct()}%</div>
          <div class="mob-field-val accent" id="mob-plus-${i}">${fmt(plus)}</div>
        </div>
      </div>
    `;
    list.appendChild(div);
  });
}

document.getElementById('mobile-list').addEventListener('input', e => {
  const inp = e.target;
  if (!inp.classList.contains('mob-input')) return;
  const i = parseInt(inp.dataset.i);
  const f = inp.dataset.f;
  state[i][f] = inp.value === '' ? null : parseFloat(inp.value);
  const {total, plus} = calcRow(state[i]);
  document.getElementById(`mob-tot-${i}`).textContent  = fmt(total);
  document.getElementById(`mob-plus-${i}`).textContent = fmt(plus);
  syncDesktopRow(i);
  updateFooters();
});

function syncMobCard(i) {
  const {total, plus} = calcRow(state[i]);
  const tEl = document.getElementById(`mob-tot-${i}`);
  const pEl = document.getElementById(`mob-plus-${i}`);
  const cInp = document.querySelector(`#mobile-list .mob-input[data-i="${i}"][data-f="cant"]`);
  const pInp = document.querySelector(`#mobile-list .mob-input[data-i="${i}"][data-f="precio"]`);
  if (tEl) tEl.textContent = fmt(total);
  if (pEl) pEl.textContent = fmt(plus);
  if (cInp) cInp.value = state[i].cant ?? '';
  if (pInp) pInp.value = state[i].precio ?? '';
}

function syncDesktopRow(i) {
  const {total, plus} = calcRow(state[i]);
  const tEl = document.getElementById(`tot-${i}`);
  const pEl = document.getElementById(`plus-${i}`);
  const cInp = document.querySelector(`#tbody input[data-i="${i}"][data-f="cant"]`);
  const pInp = document.querySelector(`#tbody input[data-i="${i}"][data-f="precio"]`);
  if (tEl) tEl.textContent = fmt(total);
  if (pEl) pEl.textContent = fmt(plus);
  if (cInp) cInp.value = state[i].cant ?? '';
  if (pInp) pInp.value = state[i].precio ?? '';
}

/* ── PCT CHANGE ── */
document.getElementById('pct').addEventListener('input', () => {
  const pct = getPct();
  state.forEach((r, i) => {
    const {plus} = calcRow(r);
    const dEl = document.getElementById(`plus-${i}`);
    const mEl = document.getElementById(`mob-plus-${i}`);
    const lEl = document.getElementById(`mob-pct-lbl-${i}`);
    if (dEl) dEl.textContent = fmt(plus);
    if (mEl) mEl.textContent = fmt(plus);
    if (lEl) lEl.textContent = `Total +${pct}%`;
  });
  updateFooters();
});

/* ── RESET ── */
function resetTable() {
  if (!confirm('¿Restaurar todos los valores originales?')) return;
  state = ORIGINAL.map(r => ({...r}));
  document.getElementById('pct').value = '10';
  renderDesktop();
  renderMobile();
  updateFooters();
}

/* ── EXPORT PDF ── */
function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
  const pct = getPct();

  doc.setFont('helvetica','bold');
  doc.setFontSize(17);
  doc.setTextColor(26,22,18);
  doc.text('Medicamentos Guantanamo', 14, 18);

  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(107,98,87);
  doc.text(`Precios en Pesos Cubanos (CUP)  |  Porcentaje: ${pct}%  |  ${new Date().toLocaleDateString('es-ES')}`, 14, 25);

  const head = [['Producto','Presentacion','Cantidad','Precio Unit.','Total',`Total +${pct}%`,'Nota']];
  let gT=0, gP=0;
  const body = state.map(r => {
    const {total,plus} = calcRow(r);
    if (total) gT += total;
    if (plus)  gP += plus;
    return [
      r.prod, r.pres,
      r.cant   != null ? r.cant.toLocaleString('es-ES')   : '',
      r.precio != null ? r.precio.toLocaleString('es-ES') : '',
      total    != null ? Math.round(total).toLocaleString('es-ES') : '',
      plus     != null ? Math.round(plus).toLocaleString('es-ES')  : '',
      r.nota || '',
    ];
  });
  body.push(['TOTAL GENERAL','','','',
    Math.round(gT).toLocaleString('es-ES'),
    Math.round(gP).toLocaleString('es-ES'),''
  ]);

  doc.autoTable({
    head, body, startY:30,
    styles:{ font:'helvetica', fontSize:9, cellPadding:4, textColor:[26,22,18] },
    headStyles:{ fillColor:[26,22,18], textColor:[245,242,235], fontStyle:'bold', fontSize:9 },
    alternateRowStyles:{ fillColor:[250,248,245] },
    columnStyles:{
      0:{fontStyle:'bold', cellWidth:32},
      1:{cellWidth:46, fontSize:8, textColor:[107,98,87]},
      2:{halign:'right', cellWidth:22},
      3:{halign:'right', cellWidth:24},
      4:{halign:'right', cellWidth:26},
      5:{halign:'right', cellWidth:26, textColor:[196,68,10], fontStyle:'bold'},
      6:{fontSize:8, textColor:[107,98,87], cellWidth:28},
    },
    didParseCell(data) {
      if (data.row.raw[0]==='Prednisona' && data.section==='body') {
        data.cell.styles.textColor=[176,168,158];
      }
      if (data.row.raw[0]==='TOTAL GENERAL' && data.section==='body') {
        data.cell.styles.fillColor=[46,40,32];
        data.cell.styles.textColor=[245,242,235];
        data.cell.styles.fontStyle='bold';
        if (data.column.index===5) data.cell.styles.textColor=[255,180,140];
      }
    },
    margin:{left:14,right:14},
  });

  doc.save(`Medicamentos_Guantanamo_${new Date().toISOString().slice(0,10)}.pdf`);
}

/* ── INIT ── */
renderDesktop();
renderMobile();
updateFooters();
</script>
</body>
</html>
